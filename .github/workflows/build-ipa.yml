name: Build ScrollCap IPA
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EthanShen10086/ScrollCap
          ref: cf81b0449c81de328dad7809ca22c110aca1db3a
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iPhone
        run: |
          xcodebuild build \
            -project ScrollCap.xcodeproj \
            -scheme ScrollCap-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=
      - name: Package and validate IPA
        run: |
          set -euo pipefail
          products=build/Build/Products/Release-iphoneos
          apps=("$products"/*.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
          lipo -archs "$app/$executable" | grep -w arm64

          found_broadcast=false
          for extension in "$app"/PlugIns/*.appex; do
            point=$(/usr/libexec/PlistBuddy -c 'Print NSExtension:NSExtensionPointIdentifier' "$extension/Info.plist")
            if [[ "$point" == com.apple.broadcast-services-upload ]]; then
              found_broadcast=true
            fi
          done
          test "$found_broadcast" = true

          mkdir -p package/Payload output
          ditto "$app" "package/Payload/$(basename "$app")"
          (cd package && ditto -c -k --keepParent Payload ../output/ScrollCap-unsigned.ipa)
          (cd output && unzip -tq ScrollCap-unsigned.ipa && shasum -a 256 ScrollCap-unsigned.ipa > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ScrollCap-unsigned-IPA
          path: output/
          if-no-files-found: error
